<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HK CRM</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0a1628; color: #fff; font-family: system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  .box { max-width: 340px; }
  .mark { width: 64px; height: 64px; margin: 0 auto 18px; border: 2px solid #c9a84c; border-radius: 50%;
          display: flex; align-items: center; justify-content: center; color: #c9a84c; font: 600 22px Georgia, serif; }
  h1 { font: 600 22px Georgia, serif; margin: 0 0 8px; }
  p { color: #b8c2d3; font-size: 14px; line-height: 1.5; margin: 0 0 22px; }
  button { background: #c9a84c; color: #0a1628; border: 0; border-radius: 8px; padding: 12px 28px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">HK</div>
    <h1>No internet connection</h1>
    <p>HK CRM needs the internet. Turn on mobile data or Wi-Fi, then try again.</p>
    <button onclick="location.href='https://www.hkbuildersanddevelopers.com/crm/'">Try again</button>
  </div>
</body>
</html>
